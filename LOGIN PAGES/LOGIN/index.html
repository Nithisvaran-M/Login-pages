<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login and Registration page</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-box login">
         <form action="">
            <h1>Login page</h1>
            <div class="input-box">
                <input type="text" placeholder="username" required>
                <i class='bx bxs-user'></i>
            </div>
             <div class="input-box">
                <input type="password" placeholder="password" required>
                <i class='bx bxs-lock'></i>
            </div>
            <div class="forgot-link">
                <a href="#">forgot password?</a>
                <br><br>
                <button type="button" class="btn" onclick="login()">Login</button>
                <br><br>
                <p>or loging with the social platform</p>
                <br>
                <div class="social-icon">
                    <a href="#" onclick="google()"><i class='bx bxl-google' ></i></a>
                    <a href="#" onclick="face()"><i class='bx bxl-facebook' ></i></a>   
                    <a href="#" onclick="git()"> <i class='bx bxl-github' ></i></a>  
                    <a href="#" onclick="link()"><i class='bx bxl-linkedin' ></i></a>   
                </div>
            </div>
         </form>
        </div>
        <div class="form-box Registration">
         <form action="">
            <h1>Registration page</h1>
            <div class="input-box">
                <input type="text" placeholder="username" required>
                <i class='bx bxs-user'></i>
            </div>
            <div class="input-box">
                <input type="email" placeholder="Email" required>
                <i class='bx bxl-gmail' ></i>
            </div>
             <div class="input-box">
                <input type="password" placeholder="password" required>
                <i class='bx bxs-lock'></i>
            </div>
                <button type="button" class="btn" onclick="register()">Register  </button>
                <br><br>
                <p>or loging with the social platform</p>
                <br>
                <div class="social-icon">
                    <a href="#" onclick="google()"><i class='bx bxl-google' ></i></a>
                    <a href="#" onclick="face()"><i class='bx bxl-facebook' ></i></a>   
                    <a href="#" onclick="git()"> <i class='bx bxl-github' ></i></a>  
                    <a href="#" onclick="link()"><i class='bx bxl-linkedin' ></i></a>   
            </div>
         </form>
        </div>



        <div class="toggle-box">
    <div class="toggle-panel toggle-left">
        <h1>hello,welcome</h1><br>
        <p>don't have an account?</p>
        <button class="btn register-btn">Register</button>
    </div>
    <div class="toggle-panel toggle-rigth">
        <h1>welcome back!</h1><br>
        <p>Already have an account?</p>
        <button class="btn login-btn">Login</button>
    </div>
</div>
    </div>


<script src="script.js"></script>

</body>
</html>
